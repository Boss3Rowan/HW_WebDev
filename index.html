<!DOCTYPE html> #says we are using HTML
<html lang = "en"> #sets language and holds all the HTML tags
    <head>
        <title>Basic Website</title>
        <meta charset="UTF-8"> 
        <style>
            #important{
                text-decoration:underline;
                color: green;
            }
            #attention{
                font-weight: bold;
            }
             #italics{
                font-weight: italic;
            }
        </style>
    </head>
    <body>
        <h1>Name of the website</h1>
        <p><span id="important">Paragraph tags</span> are used to <span id="attention">display</span> most of the text on the <span id="italics">webpage</span>.</p>
        <p>We start a new paragraph tag when we want a new paragraph on the page. <br>This way things are easier to read.</p>
    </body>
</html>
