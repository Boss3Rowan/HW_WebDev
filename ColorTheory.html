<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Color Theory</title>
        <meta charset="UTF-8">
        <style>
            .Complimentary{
                    width: 500px;
                    height: 500px;
                    background-color:rgb(141, 37, 141);
                    border-radius: 20px;
                    border: solid 40px #dbc547;
            }
               .Analogous{
                    width: 500px;
                    height: 500px;
                    background-color:rgb(39, 185, 173);
                    border-radius: 20px;
                    border: solid 40px #2986c4;
            }
               .Triadic{
                    width: 500px;
                    height: 500px;
                    background-color:rgb(77, 62, 211);
                    border-radius: 20px;
                    border: solid 40px #db495d;
                    color:rgb(233, 233, 19)
            }
        </style>
    </head>
    <body>
        <div class="Complimentary">
        <h1>Complementary</h1>
        </div>
        <div class="Analogous">
            <h1>Analogous</h1>
            </div>
        <div class="Triadic">
            <h1>Triadic</h1>
            </div>
    </body>
</html>
